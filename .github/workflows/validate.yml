name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Plugin manifests (Claude Code + Codex)
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Check out repository
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Claude Code and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code@2.1.258 @openai/codex@0.152.1

      - name: Validate manifests and install the plugin with both CLIs
        run: scripts/validate_plugins.sh

  skills:
    name: Skill packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate skills
        run: python3 scripts/validate_skills.py

  installer:
    name: Agent observability installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Test installer
        run: plugins/flowlines/skills/flowlines-agent-observability/scripts/test_installer.sh
